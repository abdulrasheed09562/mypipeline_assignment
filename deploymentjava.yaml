apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-app-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: java-app
  template:
    metadata:
      labels:
        app: java-app
    spec:
      containers:
      - name: java-app
        image: 154931140166.dkr.ecr.ap-south-1.amazonaws.com/jenkinsecr:latest
        ports:
        - containerPort: 8080
